<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We can&#39;t sign you in yet</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html { background: #fafafb; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #2f3136;
    font-size: 14px;
    line-height: 20px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    width: min(940px, 100%);
    min-height: 520px;
    overflow: hidden;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgb(10 10 10 / 8%), 0 16px 40px rgb(10 10 10 / 16%);
  }
  .brand {
    display: none;
    position: relative;
    flex: 0 0 34%;
    background: #0a0a0a;
    padding: 28px;
    color: #ffffff;
    font-weight: 600;
  }
  @media (min-width: 720px) { .brand { display: block; } }
  .brand-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .brand img { width: 28px; height: 28px; }
  .brand .watermark {
    position: absolute;
    right: -120px;
    bottom: -80px;
    width: 380px;
    height: 380px;
    opacity: 0.16;
  }
  .content {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(32px, 6vw, 64px);
  }
  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid #ebecee;
    background: #fafafb;
    color: #585a60;
  }
  h1 {
    margin-top: 28px;
    font-size: 32px;
    line-height: 40px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #1b1c20;
  }
  p {
    margin-top: 16px;
    max-width: 46ch;
    color: #585a60;
    font-size: 15px;
    line-height: 24px;
  }
  .action { margin-top: 32px; }
  .action a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 20px;
    border-radius: 8px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .action a:hover { background: #2f3136; }
  .action a:focus-visible {
    outline: 2px solid #3c5bbf;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<main>
<aside class="brand" aria-hidden="true">
  <div class="brand-row"><img src="http://localhost:3100/dana-mark.svg" alt=""> Dana</div>
  <img class="watermark" src="http://localhost:3100/dana-mark.svg" alt="">
</aside>
<section class="content">
<div class="badge" aria-hidden="true">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
</div>
<h1>We can&#39;t sign you in yet</h1>
<p>Your Google email address isn&#39;t verified. Dana uses your email for sharing and invites, so it needs Google to confirm it first. Verify your email with Google, then try again.</p>
<p class="action"><a href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to Dana</a></p>
</section>
</main>
</body>
</html>
