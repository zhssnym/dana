name: issue-482 patch

on:
  push:
    branches: [codex/issue-482-calendar-task-hue-resolution]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-482-calendar-task-hue-resolution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fix per-Task Calendar hue resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planned = Path('app/src/client/components/calendar/PlannedCalendar.tsx')
          text = planned.read_text()
          start_marker = "  return {\n    '--calendar-task-hue': String(hue),"
          end_marker = "  } as React.CSSProperties"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('identityStyle return bounds not found')
          end += len(end_marker)
          replacement = '''  const fillMix = 66 + tone * 4
          const borderMix = 34 + tone * 3
          return {
            backgroundColor: `color-mix(in oklch, var(--background) ${String(fillMix)}%, oklch(0.68 0.18 ${String(hue)}))`,
            borderColor: `color-mix(in oklch, var(--background) ${String(borderMix)}%, oklch(0.62 0.2 ${String(hue)}))`,
          }'''
          planned.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Verify frontend
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/issue-482-patch.yml .github/workflows/issue-482-fix.yml
          git config user.name "Dana patch runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/client/components/calendar/PlannedCalendar.tsx .github/workflows/issue-482-patch.yml .github/workflows/issue-482-fix.yml
          git commit -m "fix: resolve per-Task Calendar hues (#482)"
          git push
