name: Issue 487 PR backend validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/db/**'
      - 'app/src/server/**'
      - 'app/src/shared/**'
      - 'app/tests/**'
      - 'docs/spec/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Validate
        working-directory: app
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run tests/criteria/ac-423-task-schedule.test.ts tests/criteria/ac-880-task-document.test.ts tests/criteria/focus-identity-353.test.ts tests/guards/guard-document-transaction.test.ts
