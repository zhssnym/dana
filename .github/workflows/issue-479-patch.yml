name: issue-479 patch

on:
  push:
    branches: [codex/issue-479-calendar-editing-identity]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-479-calendar-editing-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repair Calendar editing, undating and identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planned = Path('app/src/client/components/calendar/PlannedCalendar.tsx')
          text = planned.read_text()

          old_identity = '''function identityStyle(id: string): React.CSSProperties {
            let hash = 0
            for (const char of id) hash = (hash * 31 + char.charCodeAt(0)) | 0
            const unsigned = hash >>> 0
            const pair = [
              [0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3],
            ] as const
            const [first, second] = pair[unsigned % pair.length] ?? pair[0]
            const mix = 15 + ((unsigned >>> 3) % 71)
            return {
              backgroundColor: `color-mix(in oklch, var(--calendar-identity-${first}) ${String(mix)}%, var(--calendar-identity-${second}))`,
              borderColor: `color-mix(in oklch, var(--calendar-identity-${first}-border) ${String(mix)}%, var(--calendar-identity-${second}-border))`,
            }
          }'''
          new_identity = '''function identityStyle(id: string): React.CSSProperties {
            // FNV-1a gives Task ids a well-distributed, deterministic identity. Hue is
            // continuous rather than a small palette slot; a second hash slice picks
            // one of three restrained tones so nearby hues still separate in a stack.
            let hash = 2166136261
            for (const char of id) {
              hash ^= char.charCodeAt(0)
              hash = Math.imul(hash, 16777619)
            }
            const unsigned = hash >>> 0
            const hue = (unsigned % 36000) / 100
            const tone = (unsigned >>> 8) % 3
            return {
              '--calendar-task-hue': String(hue),
              backgroundColor: `var(--calendar-task-fill-${String(tone)})`,
              borderColor: `var(--calendar-task-border-${String(tone)})`,
            } as React.CSSProperties
          }'''
          if old_identity not in text:
            raise SystemExit('identityStyle target not found')
          text = text.replace(old_identity, new_identity, 1)

          old_props = '''  externalDropDate = null,
            externalDragging = false,
          }: {
            /** Makes a task due on the given day; the page supplies its own capture. */
            readonly onCreate?: (title: string, date: string) => void
            readonly folderId?: string
            readonly filter?: TaskFilter
            readonly filterTasks?: readonly TaskCard[]
            readonly filterToday?: string
            readonly externalDropDate?: string | null
            readonly externalDragging?: boolean
          } = {}): React.JSX.Element {'''
          new_props = '''  externalDropDate = null,
            externalDragging = false,
            onExternalDrop,
            onExternalOver,
            onDragStateChange,
          }: {
            /** Makes a task due on the given day; the page supplies its own capture. */
            readonly onCreate?: (title: string, date: string) => void
            readonly folderId?: string
            readonly filter?: TaskFilter
            readonly filterTasks?: readonly TaskCard[]
            readonly filterToday?: string
            readonly externalDropDate?: string | null
            readonly externalDragging?: boolean
            /** Optional target outside the grid, used by Work Calendar's Undated section. */
            readonly onExternalDrop?: (taskId: string, point: { readonly x: number; readonly y: number }) => boolean
            readonly onExternalOver?: (taskId: string, point: { readonly x: number; readonly y: number }) => string | null
            readonly onDragStateChange?: (dragging: boolean) => void
          } = {}): React.JSX.Element {'''
          if old_props not in text:
            raise SystemExit('PlannedCalendar props target not found')
          text = text.replace(old_props, new_props, 1)

          old_editable = '  const editable = filter === undefined || !taskFilterActive(filter)\n'
          new_editable = '''  // Filters only narrow what is visible. A visible pending Task remains editable;
            // otherwise Calendar's default Open filter would disable every date interaction.
            const editable = true
          '''
          if old_editable not in text:
            raise SystemExit('editable target not found')
          text = text.replace(old_editable, new_editable, 1)

          old_preview = "  const [dragPreview, setDragPreview] = useState<{ drag: CalendarDrag; date: string | null; x: number; y: number; title: string } | null>(null)"
          new_preview = "  const [dragPreview, setDragPreview] = useState<{ drag: CalendarDrag; date: string | null; externalProposal: string | null; x: number; y: number; title: string } | null>(null)"
          if old_preview not in text:
            raise SystemExit('dragPreview target not found')
          text = text.replace(old_preview, new_preview, 1)

          start_marker = "  function pointerStart(pointer: ReactPointerEvent<HTMLElement>, taskId: string, action: CalendarDrag['action'], from: string): void {"
          end_marker = '\n\n  const previewReal = useMemo'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('pointerStart bounds not found')
          new_pointer = '''  function pointerStart(pointer: ReactPointerEvent<HTMLElement>, taskId: string, action: CalendarDrag['action'], from: string): void {
            if (!editable || pointer.button !== 0) return
            const row = real.find((task) => task.id === taskId)
            if (row === undefined || row.status !== 'pending') return
            if (action !== 'move') pointer.preventDefault()
            const id = pointer.pointerId
            const startX = pointer.clientX
            const startY = pointer.clientY
            const drag: CalendarDrag = { taskId, action, from }
            let lifted = false
            let target: string | null = null
            let externalTarget = false
            const clear = (): void => {
              window.removeEventListener('pointermove', move)
              window.removeEventListener('pointerup', release)
              window.removeEventListener('pointercancel', cancel)
              window.removeEventListener('keydown', key)
              document.body.style.removeProperty('cursor')
              if (grid.current?.hasPointerCapture(id)) grid.current.releasePointerCapture(id)
              setDragPreview(null)
              if (action === 'move') onDragStateChange?.(false)
            }
            const move = (event: PointerEvent): void => {
              if (event.pointerId !== id) return
              if (!lifted && Math.hypot(event.clientX - startX, event.clientY - startY) < 5) return
              if (!lifted) {
                lifted = true
                grid.current?.setPointerCapture(id)
                if (action === 'move') onDragStateChange?.(true)
              }
              document.body.style.cursor = action === 'move' ? 'grabbing' : 'ew-resize'
              const point = { x: event.clientX, y: event.clientY }
              const cell = Array.from(grid.current?.querySelectorAll<HTMLElement>('[data-date]') ?? []).find((candidate) => {
                const box = candidate.getBoundingClientRect()
                return event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom
              })
              const date = cell?.dataset.date ?? null
              target = date !== null && proposedSchedule(drag, date) !== null ? date : null
              const externalProposal = action === 'move' ? onExternalOver?.(taskId, point) ?? null : null
              externalTarget = target === null && externalProposal !== null
              setDragPreview({ drag, date: target, externalProposal: target === null ? externalProposal : null, x: event.clientX, y: event.clientY, title: row.title })
            }
            const release = (event: PointerEvent): void => {
              if (event.pointerId !== id) return
              const point = { x: event.clientX, y: event.clientY }
              const dropDate = target
              const dropExternal = lifted && action === 'move' && externalTarget
              if (dropExternal) onExternalDrop?.(taskId, point)
              clear()
              if (lifted) suppressOpenUntil.current = performance.now() + 350
              if (lifted && dropDate !== null) moveTaskTo(drag, dropDate)
            }
            const cancel = (event: PointerEvent): void => { if (event.pointerId === id) clear() }
            const key = (event: KeyboardEvent): void => { if (event.key === 'Escape') { suppressOpenUntil.current = performance.now() + 350; clear() } }
            window.addEventListener('pointermove', move)
            window.addEventListener('pointerup', release)
            window.addEventListener('pointercancel', cancel)
            window.addEventListener('keydown', key)
          }'''
          text = text[:start] + new_pointer + text[end:]

          old_label = '      >{dragPreview.title}</div> : null}'
          new_label = "      >{dragPreview.externalProposal === null ? dragPreview.title : `${dragPreview.externalProposal} · ${dragPreview.title}`}</div> : null}"
          if old_label not in text:
            raise SystemExit('drag preview label target not found')
          text = text.replace(old_label, new_label, 1)
          planned.write_text(text)

          work = Path('app/src/client/views/WorkCalendar.tsx')
          work.write_text('''import { useCallback, useMemo, useRef, useState } from 'react'\n\nimport type { TaskCard } from '../../shared/tasks.js'\nimport { useCreateTask, useUpdateTask } from '../api/mutations.js'\nimport { useFolderPage } from '../api/queries.js'\nimport { PlannedCalendar } from '../components/calendar/index.js'\nimport { ConfirmDialog, TaskRows, useConfirm } from '../pages/task-rows.js'\nimport { formatDueDate } from '../parts/presenters.js'\nimport type { RowContext } from '../parts/presenters.js'\nimport { isScheduled } from '../parts/schedule.js'\nimport { useRowActions } from '../parts/useRowActions.js'\nimport { PlaceGroup } from './usePlace.js'\nimport { taskFilterActive, taskMatchesFilter, type TaskFilter } from './filter.js'\n\n/** The shared calendar, scoped to this Work's canonical Tasks and filter. */\nexport default function WorkCalendar({ folderId, tasks, filter, context, canCreate }: {\n  readonly folderId: string\n  readonly tasks: readonly TaskCard[]\n  readonly filter: TaskFilter\n  readonly context: RowContext\n  readonly canCreate: boolean\n}): React.JSX.Element {\n  const create = useCreateTask()\n  const update = useUpdateTask()\n  const page = useFolderPage(folderId)\n  const actions = useRowActions()\n  const confirm = useConfirm()\n  const host = useRef<HTMLDivElement>(null)\n  const undatedTarget = useRef<HTMLDivElement>(null)\n  const [draggingUndated, setDraggingUndated] = useState(false)\n  const [dropDate, setDropDate] = useState<string | null>(null)\n  const [draggingScheduled, setDraggingScheduled] = useState(false)\n  const [overUndated, setOverUndated] = useState(false)\n  const onUndatedDragState = useCallback((dragging: boolean) => {\n    setDraggingUndated(dragging)\n    if (!dragging) setDropDate(null)\n  }, [])\n  const onScheduledDragState = useCallback((dragging: boolean) => {\n    setDraggingScheduled(dragging)\n    if (!dragging) setOverUndated(false)\n  }, [])\n  const filtered = taskFilterActive(filter)\n  const undated = tasks.filter((task) => !isScheduled(task) && taskMatchesFilter(task, filter, context.today))\n\n  const sectionGroups = useMemo(() => {\n    const sections = new Map((page.data?.blocks ?? [])\n      .filter((block) => block.kind === 'section')\n      .map((block) => [block.id, block]))\n    const pathOf = (id: string | null): string => {\n      const names: string[] = []\n      const seen = new Set<string>()\n      let at = id\n      while (at !== null && !seen.has(at)) {\n        seen.add(at)\n        const section = sections.get(at)\n        if (section === undefined) break\n        names.unshift(section.text || 'Untitled section')\n        at = section.section_block_id\n      }\n      return names.join(' › ')\n    }\n    const grouped = new Map<string, { readonly label: string; readonly tasks: TaskCard[] }>()\n    for (const task of undated) {\n      const key = task.section_block_id ?? 'no-section'\n      const label = task.section_block_id === null ? 'No section' : pathOf(task.section_block_id) || 'No section'\n      const group = grouped.get(key)\n      if (group === undefined) grouped.set(key, { label, tasks: [task] })\n      else group.tasks.push(task)\n    }\n    return [...grouped.entries()].map(([key, group]) => ({ key, ...group }))\n  }, [page.data?.blocks, undated])\n\n  const pointInside = (element: HTMLElement | null, point: { readonly x: number; readonly y: number }): boolean => {\n    if (element === null) return false\n    const box = element.getBoundingClientRect()\n    return point.x >= box.left && point.x <= box.right && point.y >= box.top && point.y <= box.bottom\n  }\n  const calendarDateAt = (point: { x: number; y: number }): string | null => {\n    const root = host.current\n    if (root === null) return null\n    for (const cell of Array.from(root.querySelectorAll<HTMLElement>('[data-date]'))) {\n      const box = cell.getBoundingClientRect()\n      if (point.x < box.left || point.x > box.right || point.y < box.top || point.y > box.bottom) continue\n      return cell.dataset.date ?? null\n    }\n    return null\n  }\n  const dropIntoCalendar = (taskId: string, point: { x: number; y: number }): boolean => {\n    setDropDate(null)\n    const task = undated.find((entry) => entry.id === taskId)\n    if (task === undefined || task.status !== 'pending') return false\n    const date = calendarDateAt(point)\n    if (date === null) return false\n    update.mutate({ id: taskId, body: { start_date: date } })\n    return true\n  }\n  const calendarProposal = (taskId: string, point: { x: number; y: number }): string | null => {\n    const task = undated.find((entry) => entry.id === taskId)\n    if (task === undefined || task.status !== 'pending') { setDropDate(null); return null }\n    const date = calendarDateAt(point)\n    setDropDate((was) => was === date ? was : date)\n    return date === null ? null : `Start ${formatDueDate(date, context.today)}`\n  }\n  const undatedProposal = (taskId: string, point: { readonly x: number; readonly y: number }): string | null => {\n    const task = tasks.find((entry) => entry.id === taskId)\n    const valid = task !== undefined && task.status === 'pending' && isScheduled(task) && pointInside(undatedTarget.current, point)\n    setOverUndated(valid)\n    return valid ? 'Make undated' : null\n  }\n  const dropIntoUndated = (taskId: string, point: { readonly x: number; readonly y: number }): boolean => {\n    setOverUndated(false)\n    const task = tasks.find((entry) => entry.id === taskId)\n    if (task === undefined || task.status !== 'pending' || !isScheduled(task) || !pointInside(undatedTarget.current, point)) return false\n    update.mutate({ id: taskId, body: { start_date: null, due_date: null } })\n    return true\n  }\n\n  return <div ref={host}>\n    <PlannedCalendar\n      folderId={folderId}\n      filter={filter}\n      filterTasks={tasks}\n      filterToday={context.today}\n      externalDragging={draggingUndated}\n      externalDropDate={dropDate}\n      onExternalDrop={dropIntoUndated}\n      onExternalOver={undatedProposal}\n      onDragStateChange={onScheduledDragState}\n      {...(canCreate && !filtered ? { onCreate: (title: string, date: string) => {\n        create.mutate({ title, folder_id: folderId, due_date: date })\n      } } : {})}\n    />\n    {undated.length === 0 && !draggingScheduled ? null : <div\n      ref={undatedTarget}\n      data-calendar-undated-target\n      className={`mt-6 border-t border-border pt-4 transition-colors${overUndated ? ' bg-selected' : ''}`}\n    >\n      <PlaceGroup name="Undated" heading="Undated">\n        {undated.length === 0 ? (\n          <div className="flex h-9 items-center rounded-sm px-1.5 text-xs text-muted-foreground">Drop here to make undated</div>\n        ) : (\n          <div className="space-y-4">\n            {sectionGroups.map((group) => <section key={group.key} aria-label={group.label}>\n              <h3 className="mb-1 px-1.5 text-xs font-medium text-muted-foreground">{group.label}</h3>\n              <TaskRows\n                tasks={group.tasks}\n                context={context}\n                actions={actions}\n                onAsk={confirm.ask}\n                onDropAt={dropIntoCalendar}\n                onOver={calendarProposal}\n                followAcross\n                onDragStateChange={onUndatedDragState}\n              />\n            </section>)}\n          </div>\n        )}\n      </PlaceGroup>\n    </div>}\n    <ConfirmDialog pending={confirm.pending} onClose={confirm.close} />\n  </div>\n}\n''')

          tokens = Path('app/src/client/styles/tokens.css')
          css = tokens.read_text()
          old_css = '''/* ---- i475-calendar-identity: stronger perceptual separation for the four
             stable active-Task treatments. Fills stay pastel/muted; borders carry a
             firmer version of the same hue so adjacent rows read apart at a glance. */
          :root {
            --calendar-identity-0: #dceafb;
            --calendar-identity-0-border: #7daee0;
            --calendar-identity-1: #deeee2;
            --calendar-identity-1-border: #91be9e;
            --calendar-identity-2: #f6e7c9;
            --calendar-identity-2-border: #d9b46a;
            --calendar-identity-3: #eadff3;
            --calendar-identity-3-border: #b89bcf;
          }
          [data-theme="dark"] {
            --calendar-identity-0: #1e3348;
            --calendar-identity-0-border: #4c789f;
            --calendar-identity-1: #203629;
            --calendar-identity-1-border: #4f795c;
            --calendar-identity-2: #3a2f1c;
            --calendar-identity-2-border: #826a37;
            --calendar-identity-3: #30253b;
            --calendar-identity-3-border: #6c5283;
          }'''
          new_css = '''/* ---- i479-calendar-identity: Task id supplies a continuous hue while Dana
             owns lightness/chroma. Three restrained tones add another perceptual axis
             without coloring the text or turning Calendar into a dashboard. */
          :root {
            --calendar-task-fill-0: oklch(0.87 0.1 var(--calendar-task-hue, 220));
            --calendar-task-fill-1: oklch(0.9 0.1 var(--calendar-task-hue, 220));
            --calendar-task-fill-2: oklch(0.93 0.1 var(--calendar-task-hue, 220));
            --calendar-task-border-0: oklch(0.64 0.14 var(--calendar-task-hue, 220));
            --calendar-task-border-1: oklch(0.68 0.14 var(--calendar-task-hue, 220));
            --calendar-task-border-2: oklch(0.72 0.14 var(--calendar-task-hue, 220));
          }
          [data-theme="dark"] {
            --calendar-task-fill-0: oklch(0.28 0.08 var(--calendar-task-hue, 220));
            --calendar-task-fill-1: oklch(0.33 0.08 var(--calendar-task-hue, 220));
            --calendar-task-fill-2: oklch(0.38 0.08 var(--calendar-task-hue, 220));
            --calendar-task-border-0: oklch(0.48 0.13 var(--calendar-task-hue, 220));
            --calendar-task-border-1: oklch(0.54 0.13 var(--calendar-task-hue, 220));
            --calendar-task-border-2: oklch(0.6 0.13 var(--calendar-task-hue, 220));
          }'''
          if old_css not in css:
            raise SystemExit('calendar identity token block not found')
          tokens.write_text(css.replace(old_css, new_css, 1))
          PY
      - name: Install and verify frontend
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/issue-479-patch.yml
          git config user.name "Dana patch runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/client/components/calendar/PlannedCalendar.tsx app/src/client/views/WorkCalendar.tsx app/src/client/styles/tokens.css .github/workflows/issue-479-patch.yml
          git commit -m "fix: restore Calendar editing and distinct identities (#479)"
          git push origin HEAD:codex/issue-479-calendar-editing-identity
