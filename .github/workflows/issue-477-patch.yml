name: issue-477 patch

on:
  push:
    branches: [codex/issue-477-calendar-identity-space]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Replace four-slot Calendar identity with stable mixed identity space
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/client/components/calendar/PlannedCalendar.tsx')
          text = path.read_text()
          old = """function identityStyle(id: string): React.CSSProperties {
            let hash = 0
            for (const char of id) hash = (hash * 31 + char.charCodeAt(0)) | 0
            const slot = (hash >>> 0) % 4
            return { backgroundColor: `var(--calendar-identity-${slot})`, borderColor: `var(--calendar-identity-${slot}-border)` }
          }"""
          new = """function identityStyle(id: string): React.CSSProperties {
            let hash = 0
            for (const char of id) hash = (hash * 31 + char.charCodeAt(0)) | 0
            const unsigned = hash >>> 0
            const pair = [
              [0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3],
            ] as const
            const [first, second] = pair[unsigned % pair.length] ?? pair[0]
            const mix = 15 + ((unsigned >>> 3) % 71)
            return {
              backgroundColor: `color-mix(in oklch, var(--calendar-identity-${first}) ${String(mix)}%, var(--calendar-identity-${second}))`,
              borderColor: `color-mix(in oklch, var(--calendar-identity-${first}-border) ${String(mix)}%, var(--calendar-identity-${second}-border))`,
            }
          }"""
          if text.count(old) != 1:
            raise SystemExit(f'expected one identityStyle block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Install and verify frontend build
        working-directory: app
        run: npm ci && npm run lint && npm run typecheck && npm run build
      - name: Commit patch
        run: |
          rm .github/workflows/issue-477-patch.yml
          git config user.name "Dana patch runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/client/components/calendar/PlannedCalendar.tsx .github/workflows/issue-477-patch.yml
          git commit -m "fix: expand Calendar task identity space (#477)"
          git push
