name: What's New maintenance

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: dana-updates-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate canonical updates feed
        run: npm run updates:check
      - name: Prepare public notes for confirmed deployed changes
        run: node scripts/updates/run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELP_BOT_TOKEN: ${{ secrets.HELP_BOT_TOKEN }}
