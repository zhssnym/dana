name: Publish verified What's New

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: dana-updates-publish
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/updates-') &&
      vars.UPDATES_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publish only deployed and CI-verified release history
        run: node scripts/updates/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELP_BOT_TOKEN: ${{ secrets.HELP_BOT_TOKEN }}
          UPDATES_AUTOPUBLISH: ${{ vars.UPDATES_AUTOPUBLISH }}
