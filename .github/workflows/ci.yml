name: CI

# One job, the whole suite, on every pull request, every push to main, and on
# demand. It runs on the self-hosted Windows runner on Hassan's PC.
#
# Speed comes from three things. The checkout is not wiped and `git clean`
# spares node_modules, so dependencies persist between runs; `npm ci` runs only
# when package-lock.json (or the Node version) differs from the stamp written
# into node_modules/.lock-sha by the last install. Lint, typecheck, build and
# the vitest suite run concurrently through scripts/ci-parallel.mjs. Playwright
# then reuses that build (DANA_GATE_PREBUILT=1) instead of rebuilding.
#
# The test leg is Postgres. TEST_DATABASE_URL comes from the runner's own .env,
# never from a repository secret; if it is missing the suite would silently
# fall back to PGlite, so the job refuses to start instead.
#
# `pull_request` stays unfiltered so every pull request gets a verdict. The
# push paths-ignore keeps merges that touch only editor config and root
# markdown off the runner. (The issue and PR templates were removed in #359.)
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run, except on main, whose runs are the
# verdict on what was merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: cmd

jobs:
  ci:
    runs-on: [self-hosted, windows, x64]
    # A hang killer, not a budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Clean the tree, keeping node_modules
        run: git clean -ffdx -e node_modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install (only when package-lock.json changed)
        run: |
          node -e "const f=require('fs'),h=require('crypto').createHash('sha256').update(process.version).update(f.readFileSync('package-lock.json')).digest('hex');let s='';try{s=f.readFileSync('node_modules/.lock-sha','utf8').trim()}catch{}process.exit(s===h?0:1)" && echo node_modules matches package-lock.json, skipping npm ci && exit /b 0
          call npm ci || exit /b 1
          node -e "const f=require('fs'),h=require('crypto').createHash('sha256').update(process.version).update(f.readFileSync('package-lock.json')).digest('hex');f.writeFileSync('node_modules/.lock-sha',h)"
      - name: Lint, typecheck, build and test (Postgres), in parallel
        run: |
          if "%TEST_DATABASE_URL%"=="" (
            echo TEST_DATABASE_URL is unset or empty, so the suite would silently fall back to PGlite and report a green that never touched Postgres. Set it in the runner installation .env file and restart the runner.
            exit /b 1
          )
          node scripts/ci-parallel.mjs "lint::npm run lint" "typecheck::npm run typecheck" "build::npm run build" "test::npm test"
      - name: Playwright
        env:
          DANA_GATE_PREBUILT: '1'
        run: |
          call npx playwright install chromium || exit /b 1
          npx playwright test
      # Traces, screenshots and videos from a red browser leg; absent when
      # Playwright never started, which is not a second failure.
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
