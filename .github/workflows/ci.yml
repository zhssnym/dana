name: CI

# The step order is normative: spec 11.11 fixes it as npm ci, lint, typecheck,
# test on PGlite, test on postgres:18, build, Playwright. Changing order or
# steps is an Integration Steward escalation, not an edit.
on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test on PGlite
        run: npm test
      - name: Test on postgres 18
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dana_test
      - name: Build
        run: npm run build
      # Self-activates when P8 lands the Playwright configuration; until then
      # the step is skipped, keeping the 11.11 order in place from P0 on.
      - name: Playwright
        if: hashFiles('app/playwright.config.ts') != ''
        run: npx playwright install --with-deps && npx playwright test
