name: CI

# The seven steps and their order are normative: spec 11.11 fixes them as npm ci,
# lint, typecheck, test on PGlite, test on a real Postgres 18, build, Playwright.
# Changing the set or the order is an Integration Steward escalation, not an edit.
# Where the job runs, where the postgres leg's database comes from, and which
# interpreter a step's script is handed to are job configuration: they move
# without amending 11.11, exactly as the service block they replaced always was.
#
# A pull request is checked, not a branch. `pull_request` builds the merge
# result, which is the thing that will actually land on main, and a branch that
# is green alone can still be red merged. push is narrowed to main at the same
# time and for the same reason it was widened before: with both triggers open,
# every push to a branch with an open pull request would start two jobs for one
# change, and there is exactly one runner. A branch with no pull request now
# gets no verdict, which is correct under a workflow where nothing reaches main
# except through one.
#
# `paths-ignore` keeps the job off changes no step of it can read. Measured on
# PR #52: five markdown files started all seven steps, twenty minutes of the one
# runner, and a docs job holding that runner is a code job not running. The
# second cost is the one that decided it. Every run is a fresh roll against the
# flake classes CLAUDE.md enumerates, and the merge of #49 (run 33495895742) went
# red on `ac-022` with `Hook timed out in 10000ms` having nothing to do with the
# commit. A prose change that can produce a meaningless red is how a team learns
# to skim past red.
#
# The list is only paths nothing in app/ opens. Checked rather than assumed:
# no file under app/tests/, app/src/, app/db/ or app/scripts/ reads a `docs/`
# path or any `.md`. `*` does not match `/` in these patterns, so `*.md` is the
# four root files and not app/src/client/components/README.md.
#
# **It is written twice on purpose.** GitHub Actions does not honour YAML
# anchors, so the two triggers cannot share one list. They must stay in step;
# a path ignored on `pull_request` and not on `push` means main re-runs what the
# pull request already skipped.
#
# **The gotcha, recorded before it bites.** A workflow skipped this way reports
# no check at all, not a green one. That is fine while branch protection is
# unavailable on this plan (the API answers 403, "Upgrade to GitHub Pro"), so
# nothing waits on a required check. The day this repository goes to Pro and main
# gets required checks, a docs-only pull request will block forever on a check
# that never reports, and the fix then is a second always-running job that exists
# only to report the required name.
#
# What is deliberately NOT done here: choosing which tests to run from which
# files changed. CLAUDE.md is explicit that a change under app/src/shared/** or
# app/src/server/domain/** reaches criteria in packages nobody was thinking
# about, and that the whole run is the only one that sees a cross-package
# regression. The split worth having is docs against code, not test against test.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

# One machine serves every branch, so a second push supersedes the first rather
# than queueing behind it. main is exempt: its run is the verdict a merge is
# checked against, and a cancelled verdict is not a verdict. A pull request's
# ref is refs/pull/N/merge, so each one keeps its own group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: app
    shell: cmd

jobs:
  ci:
    runs-on: [self-hosted, windows, x64]
    # A hang killer, not a budget. 20 was P0's number for a hosted job whose
    # fifth leg had never run, and two independent measurements now say it is
    # too small. On this machine, 2026-08-11, with every cache warm: npm ci 7s,
    # lint 4s, typecheck 5s, the PGlite leg 234s, build 5s, so five legs in 255s
    # with the postgres leg still to add and a cold npm ci still to pay for. On
    # p8-client, measured on a hosted runner: the four legs ahead of the browser
    # one cost 13.5 to 14.5 minutes, and three of the four runs before that
    # branch's workflow commit were killed with Playwright mid-leg. A timeout
    # that trips produces a cancelled job rather than a red one, which destroys
    # the evidence of whatever broke, and it lands hardest on the browser leg,
    # which is both last in order and the only leg any browser criterion runs
    # in. 40 is p8-client's number, adopted here rather than a different one so
    # that two branches editing this line converge instead of colliding. It
    # costs nothing on a healthy run, being a ceiling rather than an allocation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # The empty string is what makes this leg PGlite, and without it this step
      # has been running Postgres. TEST_DATABASE_URL arrives from the runner
      # installation's .env into the *job* environment, per the bullet below,
      # so every step inherits it, including this one. Two Postgres legs, no
      # PGlite leg, and both green: the exact false green the guard on the next
      # step exists to prevent, in mirror image.
      #
      # Empty rather than absent because app/db/client.ts treats '' as unset by
      # construction, which is the same condition the next step's guard tests.
      # The two agree without being kept in step.
      - name: Test on PGlite
        env:
          TEST_DATABASE_URL: ''
        run: npm test
      # TEST_DATABASE_URL arrives from the runner installation's own .env file,
      # never from a repository secret and never from this file: 11.11's Secrets
      # bullet rules that a credential for a resource GitHub cannot reach is not
      # stored at GitHub. The database it names is the one 11.10's CREATE
      # DATABASE statement fixes to the builtin C.UTF-8 locale.
      #
      # The guard is what stops this step passing by running PGlite twice.
      # Because the string arrives from outside this file, a missing .env, a
      # misspelled name, or a service started before the file was written all
      # leave the seam in app/db/client.ts falling back to PGlite, and the step
      # would report a second identical green having measured nothing. It tests
      # presence and nothing else: the value is never read into a command, never
      # echoed, and never named here. Unset and empty are one case because that
      # is exactly the seam's own fallback condition, so the two agree by
      # construction rather than by being kept in step.
      - name: Test on a real Postgres 18
        shell: cmd
        run: |
          if "%TEST_DATABASE_URL%"=="" (
            echo TEST_DATABASE_URL is unset or empty, so this step would re-run the PGlite leg and report a green that measured nothing. Set it in the runner installation .env file ^(spec 11.11^) and restart the runner service.
            exit /b 1
          )
          npm test
      - name: Build
        run: npm run build
      # The fifth leg. The condition is P0's design and it guards history:
      # a commit predating the config has no runner to invoke, and skipping
      # is the honest answer there.
      #
      # A second condition stood beside it until P8, requiring a matching
      # spec to exist as well, because the P8 kickoff split this seam by file
      # and between the config's commit and the first spec's commit
      # playwright test treats finding no spec as an error rather than an
      # empty pass. That gap has closed: the specs are committed and specs
      # can only be added, so the condition can no longer be false while the
      # config is true. It is removed rather than left standing, and the
      # reason is the one this comment used to give for rejecting the
      # no-tests-found flag. A skipped step is green, so a condition that can
      # only ever be true is a live way for this leg to go quiet without
      # anyone reading a red: it is that flag written in YAML, and this leg
      # is the only one any browser acceptance criterion runs in.
      #
      # The shell is declared for the same reason as the step above. cmd gives
      # && one stable meaning on the Windows runner and does not depend on the
      # machine-wide PowerShell execution policy. Leaving the interpreter to
      # whatever happens to be on PATH would make the gate's behaviour a
      # function of what is installed rather than of what is written here.
      #
      # Two halves of the install command come from different branches and
      # both are deliberate. chromium is p8-client's, naming the one browser
      # the config's single project uses, because installing the other two
      # costs minutes of this job for something nothing runs. The dropped
      # --with-deps is main's: that flag installs Linux system packages
      # through apt and does nothing a Windows runner can use.
      - name: Playwright
        if: hashFiles('app/playwright.config.ts') != ''
        shell: cmd
        run: npx playwright install chromium && npx playwright test

      # What a red browser leg leaves behind. Without this a failure is a name
      # and a stack in the log, and the trace, the screenshot and the video the
      # config already produces die with the runner. That matters most for the
      # person who cannot reproduce it: the frontend half of this project is
      # worked by someone whose machine is not this one, and the difference
      # between debugging a red check and asking about it is these files.
      #
      # failure() rather than always(): a green run's artifacts are noise.
      # if-no-files-found: ignore because this step also runs when an earlier
      # leg failed and Playwright never started, and a missing directory is
      # then the correct outcome rather than a second failure.
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 7
