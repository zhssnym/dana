name: CI

# The step order is normative: spec 11.11 fixes it as npm ci, lint, typecheck,
# test on PGlite, test on postgres:18, build, Playwright. Changing order or
# steps is an Integration Steward escalation, not an edit.
on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test on PGlite
        run: npm test
      - name: Test on postgres 18
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dana_test
      - name: Build
        run: npm run build
      # The fifth leg, and the only one whose first execution in this
      # project's history is still ahead of it. P0 keyed it on the
      # configuration file alone, when a config was the only half anyone
      # could foresee; P8 splits that seam by file, so the config lands with
      # the Platform session and the first spec lands later with the
      # Adversarial Test session. Between those two commits the config exists
      # and tests/e2e/ is empty, and playwright test treats finding no spec
      # as an error rather than an empty pass, which would turn this leg red
      # for the length of that gap on a branch whose other four are green.
      #
      # Both halves are therefore named. The alternative, passing
      # a no-tests-found flag, buys the same quiet by making an empty
      # collection permanently indistinguishable from a passing one, and this
      # leg is where ten acceptance criteria will live.
      - name: Playwright
        if: hashFiles('app/playwright.config.ts') != '' && hashFiles('app/tests/e2e/**/*.spec.ts') != ''
        # Only the browser the config's single project names. Installing the
        # other two costs minutes of this job for something nothing runs.
        run: npx playwright install --with-deps chromium && npx playwright test
