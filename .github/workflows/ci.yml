name: CI

# Runs on the self-hosted Windows runner on Hassan's PC. node_modules stays between runs.
# TEST_DATABASE_URL comes from the runner's .env. Without it the tests use PGlite, so the job stops.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

# A new push cancels the old run, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: cmd

jobs:
  ci:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Clean the tree, keeping node_modules
        run: git clean -ffdx -e node_modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install (only when package-lock.json changed)
        run: |
          node -e "const f=require('fs'),h=require('crypto').createHash('sha256').update(process.version).update(f.readFileSync('package-lock.json')).digest('hex');let s='';try{s=f.readFileSync('node_modules/.lock-sha','utf8').trim()}catch{}process.exit(s===h?0:1)" && echo node_modules matches package-lock.json, skipping npm ci && exit /b 0
          call npm ci || exit /b 1
          node -e "const f=require('fs'),h=require('crypto').createHash('sha256').update(process.version).update(f.readFileSync('package-lock.json')).digest('hex');f.writeFileSync('node_modules/.lock-sha',h)"
      - name: Lint, typecheck, build and test (Postgres), in parallel
        run: |
          if "%TEST_DATABASE_URL%"=="" (
            echo TEST_DATABASE_URL is unset or empty, so the suite would silently fall back to PGlite and report a green that never touched Postgres. Set it in the runner installation .env file and restart the runner.
            exit /b 1
          )
          npx concurrently -n lint,typecheck,build,test "npm run lint" "npm run typecheck" "npm run build" "npm test"
      - name: Playwright
        env:
          DANA_E2E_PREBUILT: '1'
        run: |
          call npx playwright install chromium || exit /b 1
          npx playwright test
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
