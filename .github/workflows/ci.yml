name: CI

# The step order is normative: spec 11.11 fixes it as npm ci, lint, typecheck,
# test on PGlite, test on postgres:18, build, Playwright. Changing order or
# steps is an Integration Steward escalation, not an edit.
on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hang killer, not a budget. 20 was P0's number for a job whose fifth
    # leg had never run; measured on this branch, the four legs ahead of the
    # browser one cost 13.5 to 14.5 minutes of it, and three of the four runs
    # before this commit were killed with Playwright mid-leg. What that
    # produces is a cancelled job rather than a red one: the leg's own
    # evidence, the named assertion of the case that broke, is destroyed by
    # the clock, which is the same false signal the condition below argues
    # against. The fourteen minutes in front of the browser leg do not shrink
    # as the client fills in, and a red case is slower than a green one
    # because it spends its timeouts, so the pressure is upward on the run
    # that most needs to finish. 40 keeps a genuinely hung job from burning
    # GitHub's six-hour default, and costs nothing on a healthy run, because
    # this is a ceiling and not an allocation.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test on PGlite
        run: npm test
      - name: Test on postgres 18
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dana_test
      - name: Build
        run: npm run build
      # The fifth leg. The condition is P0's design and it guards history:
      # a commit predating the config has no runner to invoke, and skipping
      # is the honest answer there.
      #
      # A second condition stood beside it until P8, requiring a matching
      # spec to exist as well, because the P8 kickoff split this seam by file
      # and between the config's commit and the first spec's commit
      # playwright test treats finding no spec as an error rather than an
      # empty pass. That gap has closed: the specs are committed and specs
      # can only be added, so the condition can no longer be false while the
      # config is true. It is removed rather than left standing, and the
      # reason is the one this comment used to give for rejecting the
      # no-tests-found flag. A skipped step is green, so a condition that can
      # only ever be true is a live way for this leg to go quiet without
      # anyone reading a red: it is that flag written in YAML, and this leg
      # is the only one any browser acceptance criterion runs in.
      - name: Playwright
        if: hashFiles('app/playwright.config.ts') != ''
        # Only the browser the config's single project names. Installing the
        # other two costs minutes of this job for something nothing runs.
        run: npx playwright install --with-deps chromium && npx playwright test
