name: CI

# GitHub-hosted runner. Postgres runs as a service container. The tests use it through
# TEST_DATABASE_URL; without it they would fall back to PGlite and report a green that never
# touched Postgres, so the job sets it for every step.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

# A new push cancels the old run, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dana_ci
          POSTGRES_PASSWORD: dana_ci
          POSTGRES_DB: dana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dana_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dana_ci:dana_ci@localhost:5432/dana_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, typecheck, build
        run: npm run gate
      - name: Test (Postgres)
        run: npm test -- --maxWorkers=4
      - name: Playwright
        env:
          DANA_E2E_PREBUILT: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
