name: Feature or change
description: Something new, or something that should work differently.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What it should do
      description: >
        In plain language, from the point of view of someone using Dana.
        No technical wording needed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem this solves, or what is annoying today.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it lives
      placeholder: app/src/client/views/, or "the task row"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: How big is this
      description: >
        A guess, and it is fine to be wrong. Only the last option changes
        anything: a big feature becomes several issues and merges as several
        pull requests, with the screen last.
      options:
        - Small, a few hours
        - A normal feature
        - Big. Weeks of work on both sides
    validations:
      required: true
