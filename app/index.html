<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
    The locked Dana Mark, as the favicon this document has never carried. It is
    DES-030's own SVG, copied unmodified into the client's public directory:
    not redrawn, outlined, ringed, shadowed, or put in a decorative container.

    An SVG rather than a generated .ico, because the mark is vector and every
    browser this product targets takes image/svg+xml. The manifest's own icons
    are the two PNG rasters beside it, which vite.config.ts declares and which
    the installed shell uses; a favicon and a manifest icon are different
    surfaces and neither substitutes for the other.
    -->
    <link rel="icon" href="/dana-mark.svg" type="image/svg+xml" />
    <title>Dana</title>
    <!--
    The theme, before the first paint (RFC 0005 change control item 43, and
    9.7's sentence). The 4.19 column is the record; `lib/theme.ts` mirrors its
    value into the browser under the key read here, and this script paints
    the first frame from the mirror so a person on Dark does not see a white
    frame while the bundle is fetched. It never writes the column, a stale or
    absent mirror costs exactly one frame, and `system` is resolved here the
    way `resolvedTheme` resolves it, by asking the media query, so a choice to
    follow the device is never turned into a fixed theme by this script. The
    attribute is always `light` or `dark`, which is what `shell/appearance.ts`
    writes and what `styles/tokens.css` answers.
    -->
    <script>
      ;(function () {
        try {
          var choice = window.localStorage.getItem('dana:theme')
          var dark =
            choice === 'dark' ||
            (choice !== 'light' &&
              !!window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          /* No storage is no mirror, and the bundle paints the second frame. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
