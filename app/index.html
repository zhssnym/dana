<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/dana-mark.svg" type="image/svg+xml" />
    <title>Dana</title>
    <!-- Theme before first paint, from lib/theme.ts's mirror ('dana:theme').
    The script's bytes are hashed into the CSP in src/server/index.ts
    (THEME_SCRIPT_HASH): change both or neither. shell/appearance.ts keeps
    theme-color in step with data-theme. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(function () {
        try {
          var choice = window.localStorage.getItem('dana:theme')
          var dark =
            choice === 'dark' ||
            (choice !== 'light' &&
              !!window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          /* No storage is no mirror, and the bundle paints the second frame. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
