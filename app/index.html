<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/dana-mark.svg" type="image/svg+xml" />
    <title>Dana</title>
    <!-- Theme before first paint, from lib/theme.ts's mirror ('dana:theme').
    The theme-color follows data-theme, however it later changes. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(function () {
        try {
          var choice = window.localStorage.getItem('dana:theme')
          var dark =
            choice === 'dark' ||
            (choice !== 'light' &&
              !!window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          /* No mirror: the bundle paints the second frame. */
        }
        var root = document.documentElement
        var meta = document.querySelector('meta[name="theme-color"]')
        function paintMeta() {
          if (meta) meta.setAttribute('content', root.getAttribute('data-theme') === 'dark' ? '#191919' : '#ffffff')
        }
        paintMeta()
        new MutationObserver(paintMeta).observe(root, { attributes: true, attributeFilter: ['data-theme'] })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
